[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "english-reader"
version = "0.2.0"
description = "Desktop app for practicing English pronunciation with neural TTS, IPA guidance and shadowing practice."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "Mane087" },
]
keywords = [
    "english",
    "ipa",
    "phonetics",
    "pronunciation",
    "shadowing",
    "text-to-speech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Canonical dependency list. `requirements.txt` mirrors this array and is kept
# for tooling that expects it — update both together.
#
# These do not cover the system libraries: espeak-ng on both platforms, plus
# python3-tk and libportaudio2 on Linux. See the README.
dependencies = [
    "customtkinter==6.0.0",
    "edge-tts==7.2.8",
    "numpy==2.5.2",
    "phonemizer==3.4.0",
    "sounddevice==0.5.5",
    "soundfile==0.14.0",
]

[project.optional-dependencies]
build = ["pyinstaller"]

[project.scripts]
english-reader = "english_reader.app:main"

[project.urls]
Homepage = "https://github.com/Mane087/english_reader"
Repository = "https://github.com/Mane087/english_reader"
Issues = "https://github.com/Mane087/english_reader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py311"
